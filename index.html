<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Behnoodph AR AP</title>
<meta name="description" content="داشبورد حساب‌های دریافتنی و پرداختنی بهنود فارمد، تیر تا شهریور ۱۴۰۵">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: one centred column of tiles and cards; tokens below are the dashboard theme */
:root{
  --font-anthropic-sans:"Vazirmatn",Tahoma,"Segoe UI",system-ui,sans-serif;
  --font-anthropic-serif:"Vazirmatn",Tahoma,serif;
  --cds-font-size-caption:.8rem;--cds-font-size-body:.95rem;--cds-font-size-heading:1.05rem;--cds-font-size-title:1.6rem;
  --cds-font-weight-medium:600;
  --cds-gap-xs:4px;--cds-gap-sm:8px;--cds-gap-md:14px;--cds-gap-lg:22px;--cds-gap-xl:32px;
  --cds-pad-xs:4px;--cds-pad-sm:8px;--cds-pad-md:14px;--cds-pad-lg:18px;
  --cds-radius:8px;--cds-dur-slow:.4s;
  --color-bg:#f6f7f9;--color-panel:#ffffff;--color-fg:#1c2430;--color-fg-muted:#5f6b7a;--color-border-line:#e1e5ea;
  --color-ok:#1d7a4d;--color-warn:#a66300;--color-bad:#c0362c;
  --cds-chart-muted:#b9c1cc;--cds-chart-grid:#eceff3;--cds-chart-axis:#9aa4b1;
  --cds-surface-popover:#ffffff;--cds-border:#d5dae1;--cds-shadow-popover:0 6px 18px rgba(20,30,45,.14);--cds-text-secondary:#5f6b7a;
  --series-1:#2a6fdb;--series-2:#d9622b;--navy:#1b2a5c;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --color-bg:#12161c;--color-panel:#1a2029;--color-fg:#e6eaf0;--color-fg-muted:#9aa5b4;--color-border-line:#2b333f;
  --color-ok:#4cc38a;--color-warn:#e0a33a;--color-bad:#f07167;
  --cds-chart-muted:#4a5563;--cds-chart-grid:#242b35;--cds-chart-axis:#5d6878;
  --cds-surface-popover:#202834;--cds-border:#364051;--cds-shadow-popover:0 6px 18px rgba(0,0,0,.45);--cds-text-secondary:#9aa5b4;
  --series-1:#6ea2ff;--series-2:#ff9461;--navy:#9db4f0;color-scheme:dark}}
:root[data-theme="dark"]{
  --color-bg:#12161c;--color-panel:#1a2029;--color-fg:#e6eaf0;--color-fg-muted:#9aa5b4;--color-border-line:#2b333f;
  --color-ok:#4cc38a;--color-warn:#e0a33a;--color-bad:#f07167;
  --cds-chart-muted:#4a5563;--cds-chart-grid:#242b35;--cds-chart-axis:#5d6878;
  --cds-surface-popover:#202834;--cds-border:#364051;--cds-shadow-popover:0 6px 18px rgba(0,0,0,.45);--cds-text-secondary:#9aa5b4;
  --series-1:#6ea2ff;--series-2:#ff9461;--navy:#9db4f0;color-scheme:dark}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--color-bg);color:var(--color-fg);font-family:var(--font-anthropic-sans);font-size:14px}
#dash-root{max-width:1200px;margin-inline:auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dash-skeleton{background:var(--color-border-line);border-radius:var(--cds-radius);opacity:.5}
.lk{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.lk-card{width:100%;max-width:420px;background:var(--color-panel);border:1px solid var(--color-border-line);border-radius:14px;padding:32px 28px;box-shadow:var(--cds-shadow-popover);display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.lk-mark{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--navy);background:color-mix(in srgb,var(--navy) 12%,transparent)}
.lk-title{margin:4px 0 0;font-size:1.35rem;font-weight:600;color:var(--navy);text-wrap:balance;line-height:1.6}
.lk-sub{margin:0;color:var(--color-fg-muted);font-size:var(--cds-font-size-body)}
.lk-row{display:flex;gap:8px;margin-top:8px}
.lk-input{flex:1;min-width:0;font:inherit;font-size:1rem;padding:10px 12px;border-radius:8px;border:1px solid var(--color-border-line);background:var(--color-bg);color:var(--color-fg)}
.lk-input:focus-visible,.lk-btn:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.lk-btn{font:inherit;font-weight:600;padding:10px 18px;border-radius:8px;border:0;background:var(--navy);color:var(--color-panel);cursor:pointer}
.lk-btn:disabled{opacity:.7;cursor:wait}
.lk-err{margin:0;color:var(--color-bad);font-size:var(--cds-font-size-caption)}
.bh-foot{margin-top:var(--cds-gap-xl);color:var(--color-fg-muted);font-size:var(--cds-font-size-caption)}
</style>

<script>
/* Minimal runtime standing in for the hosted dashboard: embedded data, filters, redraws. */
window.dash = (function () {
  let DATA = {};
  const DEFAULTS = {ar_terms: 30, ap_terms: 30, ap_scope: 'trade'};
  let params = Object.assign({}, DEFAULTS);
  const draws = new Map(), onDataFns = [], calcs = {};
  const res = (rows) => ({status: 'ok', data: rows, columns: Object.keys(rows[0] || {}), meta: [], refreshing: false});
  function data(id) {
    if (calcs[id]) { const c = calcs[id]; if (!c.val) c.val = c.fn(...c.inputs.map(i => data(i).data)); return res(c.val); }
    return DATA[id] ? res(DATA[id]) : {status: 'missing', data: [], columns: [], meta: []};
  }
  function run(name) {
    const fn = draws.get(name); if (!fn) return;
    document.querySelectorAll('[data-draw="' + name + '"]').forEach(el => {
      if (el.closest('[hidden]') && !el.hasAttribute('hidden')) return;
      try { fn(el); } catch (e) { console.error('draw ' + name, e); }
    });
  }
  function all() { onDataFns.forEach(f => { try { f(); } catch (e) { console.error(e); } }); draws.forEach((_, n) => run(n)); }
  let ready = false;
  function start(d) {
    DATA = d; ready = true; all();
    new MutationObserver((recs) => { if (recs.some(r => r.target.hasAttribute && r.target.hasAttribute('data-page'))) all(); }).observe(document.getElementById('dash-root'), {subtree: true, attributes: true, attributeFilter: ['hidden']});
    let t; window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(all, 150); });
  }
  return {
    _start: start,
    data,
    params: () => Object.assign({}, params),
    setParams: (p) => { params = Object.assign({}, params, p); if (ready) all(); },
    resetParams: () => { params = Object.assign({}, DEFAULTS); if (ready) all(); },
    draw: (name, fn) => { if (fn) { draws.set(name, typeof fn === 'function' ? fn : (el) => (fn.update || fn.mount)(el)); if (ready) run(name); } else run(name); },
    onData: (fn) => { onDataFns.push(fn); if (ready) fn(); },
    calc: (id, def) => { calcs[id] = def; },
    loader: () => {}, refresh: () => {},
    setLink: (name) => { try { history.replaceState(null, '', '#' + name); } catch (e) {} },
    colors: ['var(--series-1)', 'var(--series-2)', '#3a9d7a', '#9b6bd6', '#c9a227', '#d6577e', '#4aa3b8', '#8a8f98'],
  };
})();
</script>

<script>
(function () {
  const P = JSON.parse(document.getElementById('bh-enc').textContent);
  const b64 = (x) => Uint8Array.from(atob(x), c => c.charCodeAt(0));
  const input = document.getElementById('lk-pass'), btn = document.getElementById('lk-btn'), err = document.getElementById('lk-err');
  async function unlock() {
    err.hidden = true; btn.disabled = true; btn.textContent = 'در حال بازکردن…';
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(input.value), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(P.iv)}, key, b64(P.ct));
      const pay = JSON.parse(new TextDecoder().decode(plain));
      const root = document.getElementById('dash-root');
      root.innerHTML = pay.html;
      pay.scripts.forEach(code => { const el = document.createElement('script'); el.textContent = code; document.body.appendChild(el); });
      document.getElementById('bh-lock').remove(); root.hidden = false;
      window.dash._start(pay.data);
    } catch (e) {
      err.hidden = false; btn.disabled = false; btn.textContent = 'ورود'; input.select();
    }
  }
  btn.addEventListener('click', unlock);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock(); });
  input.focus();
})();
</script>
